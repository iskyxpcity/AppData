name: Voyage shadow caller cross-reference

on:
  push:
    branches:
      - analysis/voyage-full-dex-forensics-20261121
    paths:
      - ".github/workflows/voyage-shadow-caller-xrefs.yml"

permissions:
  contents: read

jobs:
  xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DEX partitions
        uses: actions/checkout@v4
        with:
          ref: analysis/voyage-full-dex-forensics-20261121
          sparse-checkout: |
            voyage/classes.dex
            voyage/classes2.dex
            voyage/classes6.dex
            voyage/classes7.dex
            voyage/classes8.dex
            voyage/classes9.dex

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download baksmali
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/baksmali.jar" https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          java -jar "$RUNNER_TEMP/baksmali.jar" --version

      - name: Disassemble and locate real shadow callers
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/voyage-xrefs"
          mkdir -p "$OUT/smali" "$OUT/hits"
          DEXES=(voyage/classes.dex voyage/classes2.dex voyage/classes6.dex voyage/classes7.dex voyage/classes8.dex voyage/classes9.dex)
          for dex in "${DEXES[@]}"; do
            name="$(basename "$dex" .dex)"
            echo "Disassembling $dex"
            java -Xmx3g -jar "$RUNNER_TEMP/baksmali.jar" disassemble "$dex" -o "$OUT/smali/$name"
          done
          PATTERNS=(
            'Ldefpackage/dko;->Io(F)V'
            'Ldefpackage/dko;->oo(J)V'
            'Ldefpackage/dko;->llO(J)V'
            'Ldefpackage/dko;->loO(Landroid/graphics/Outline;J)V'
            'Ldefpackage/bko;-><init>(Ldefpackage/dko;)V'
            'Ldefpackage/bko;->l()V'
            'Ldefpackage/wgo0;'
          )
          : > "$OUT/XREFS.txt"
          for pattern in "${PATTERNS[@]}"; do
            echo "===== $pattern =====" | tee -a "$OUT/XREFS.txt"
            grep -R -n -F -B 12 -A 18 "$pattern" "$OUT/smali" >> "$OUT/XREFS.txt" || true
          done
          find "$OUT/smali" -type f -name '*.smali' -print0 | xargs -0 grep -l -E 'Ldefpackage/(dko|bko|wgo0);' | while read -r file; do
            cp --parents "$file" "$OUT/hits/"
          done
          cd "$RUNNER_TEMP"
          zip -qr voyage-shadow-caller-xrefs.zip voyage-xrefs/XREFS.txt voyage-xrefs/hits
      - name: Upload xref evidence
        uses: actions/upload-artifact@v4
        with:
          name: voyage-shadow-caller-xrefs
          path: ${{ runner.temp }}/voyage-shadow-caller-xrefs.zip
          if-no-files-found: error
          retention-days: 14
