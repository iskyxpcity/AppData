name: Voyage shadow caller cross-reference

on:
  push:
    branches:
      - analysis/voyage-full-dex-forensics-20261121
    paths:
      - ".github/workflows/voyage-shadow-caller-xrefs.yml"
      - "tools/voyage_dex_shadow_xrefs.py"

permissions:
  contents: read

jobs:
  xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DEX partitions
        uses: actions/checkout@v4
        with:
          ref: analysis/voyage-full-dex-forensics-20261121
          sparse-checkout: |
            voyage/classes.dex
            voyage/classes2.dex
            voyage/classes6.dex
            voyage/classes7.dex
            voyage/classes8.dex
            voyage/classes9.dex
            tools/voyage_dex_shadow_xrefs.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Scan DEX method and field references
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/voyage-xrefs"
          mkdir -p "$OUT"
          python3 tools/voyage_dex_shadow_xrefs.py voyage/classes.dex voyage/classes2.dex voyage/classes6.dex voyage/classes7.dex voyage/classes8.dex voyage/classes9.dex | tee "$OUT/XREFS.txt"
          cd "$RUNNER_TEMP"
          zip -qr voyage-shadow-caller-xrefs.zip voyage-xrefs/XREFS.txt
      - name: Upload xref evidence
        uses: actions/upload-artifact@v4
        with:
          name: voyage-shadow-caller-xrefs
          path: ${{ runner.temp }}/voyage-shadow-caller-xrefs.zip
          if-no-files-found: error
          retention-days: 14
