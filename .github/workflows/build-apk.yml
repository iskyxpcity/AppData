name: Build Voyage Theme Shell APK
on:
  push:
    branches: [voyage-theme-shell]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Fetch Voyage font from main branch
        run: |
          mkdir -p app/src/main/res/font
          curl -sL -o app/src/main/res/font/lxgwwenkaigb_regular.ttf "https://raw.githubusercontent.com/iskyxpcity/AppData/main/voyage/assets/fonts/LXGWWenKaiGB-Regular.ttf"
          ls -lh app/src/main/res/font/
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voyage-theme-shell-debug
          path: app/build/outputs/apk/debug/app-debug.apk
