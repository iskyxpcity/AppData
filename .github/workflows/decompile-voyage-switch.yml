name: Decompile Voyage liquid glass switch classes

on:
  push:
    branches:
      - analysis/voyage-liquid-glass-switch-20261106
    paths:
      - ".github/workflows/decompile-voyage-switch.yml"

permissions:
  contents: read
  actions: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Voyage DEX archive
        uses: actions/checkout@v4
        with:
          ref: analysis/voyage-liquid-glass-switch-20261106
          fetch-depth: 1

      - name: Install JADX 1.5.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  /tmp/jadx.zip" | sha256sum -c -
          mkdir -p /opt/jadx
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version

      - name: Index DEX files and decompile only the DEX files containing switch classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/voyage-selected /tmp/voyage-dex
          python3 - <<'PY'
          import struct
          from pathlib import Path

          targets = set("""ixv0 rdf mcv qqf usf z6t0 jqf kqf g1u qft cyi nyi eyi kyi hqf iqf gqf us t5d mrv0 jow0 hfp ffr v6g0 x7l0 o03 j2f0""".split())

          def uleb(data, pos):
              value = shift = 0
              while True:
                  b = data[pos]
                  pos += 1
                  value |= (b & 0x7f) << shift
                  if b < 0x80:
                      return value, pos
                  shift += 7

          def dex_classes(path):
              data = path.read_bytes()
              if data[:3] != b'dex':
                  return set()
              str_size, str_off = struct.unpack_from('<II', data, 0x38)
              type_size, type_off = struct.unpack_from('<II', data, 0x40)
              class_size, class_off = struct.unpack_from('<II', data, 0x60)
              strings = []
              for i in range(str_size):
                  off, = struct.unpack_from('<I', data, str_off + 4*i)
                  _, p = uleb(data, off)
                  end = data.index(b'\0', p)
                  strings.append(data[p:end].decode('utf-8', 'replace'))
              types = [struct.unpack_from('<I', data, type_off + 4*i)[0] for i in range(type_size)]
              found = set()
              for i in range(class_size):
                  class_idx, = struct.unpack_from('<I', data, class_off + 32*i)
                  desc = strings[types[class_idx]]
                  if desc.startswith('Ldefpackage/') and desc.endswith(';'):
                      name = desc[len('Ldefpackage/'):-1]
                      if name in targets:
                          found.add(name)
              return found

          dex_files = sorted(Path('voyage').glob('classes*.dex'))
          if len(dex_files) < 10:
              raise SystemExit(f'Expected multidex archive, found {len(dex_files)} DEX files')
          mapping = {}
          for dex in dex_files:
              found = dex_classes(dex)
              if found:
                  mapping[dex] = found
                  print(f'{dex}: {sorted(found)}')
          found_all = set().union(*mapping.values()) if mapping else set()
          missing = sorted(targets - found_all)
          (Path('/tmp/voyage-selected')/'DEX_INDEX.txt').write_text(
              '\n'.join(f'{p}: {sorted(v)}' for p,v in mapping.items()) +
              '\nMISSING: ' + ', '.join(missing), encoding='utf-8')
          if 'ixv0' not in found_all or 'jqf' not in found_all:
              raise SystemExit(f'Critical switch classes missing from DEX index: {missing}')
          PY
          while IFS= read -r dex; do
            [ -n "$dex" ] || continue
            out="/tmp/voyage-dex/$(basename "$dex" .dex)"
            mkdir -p "$out"
            echo "===== Decompiling only $dex ====="
            /opt/jadx/bin/jadx --threads-count 4 --no-res -d "$out" "$dex"
            for c in ixv0 rdf mcv qqf usf z6t0 jqf kqf g1u qft cyi nyi eyi kyi hqf iqf gqf us t5d mrv0 jow0 hfp ffr v6g0 x7l0 o03 j2f0; do
              f="$(find "$out" -type f -path "*/defpackage/$c.java" -print -quit)"
              if [ -n "$f" ]; then cp "$f" "/tmp/voyage-selected/$c.java"; fi
            done
          done < <(python3 - <<'PY'
          from pathlib import Path
          for line in (Path('/tmp/voyage-selected/DEX_INDEX.txt')).read_text().splitlines():
              if line.startswith('voyage/'):
                  print(line.split(':',1)[0])
          PY
          )
          test -f /tmp/voyage-selected/ixv0.java
          test -f /tmp/voyage-selected/jqf.java
          cd /tmp
          zip -qr voyage-liquid-glass-switch-source.zip voyage-selected
          ls -lh /tmp/voyage-liquid-glass-switch-source.zip

      - name: Upload selected decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: voyage-liquid-glass-switch-source
          path: /tmp/voyage-liquid-glass-switch-source.zip
          if-no-files-found: error
          retention-days: 7
