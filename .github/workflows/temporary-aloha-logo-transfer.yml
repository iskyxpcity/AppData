name: Temporary Aloha logo asset transfer
on:
  push:
    branches:
      - transfer/aloha-logo-assets-20261020
permissions:
  contents: read
jobs:
  export-logo-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design source
        uses: actions/checkout@v4
      - name: Prepare size-appropriate image copies
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          import io
          import math

          tasks = [
              ("Logo001.jpg", "logo001.jpg", "JPEG"),
              ("Logo002.png", "logo002.png", "PNG"),
          ]
          for source_name, output_name, fmt in tasks:
              source = Path(source_name)
              with Image.open(source) as im:
                  original_size = im.size
                  image = im.copy()
              image.thumbnail((1024, 1024), Image.Resampling.LANCZOS)
              if fmt == "JPEG":
                  if image.mode not in ("RGB", "L"):
                      bg = Image.new("RGB", image.size, (255, 255, 255))
                      if "A" in image.getbands():
                          bg.paste(image, mask=image.getchannel("A"))
                      else:
                          bg.paste(image.convert("RGB"))
                      image = bg
                  image = image.convert("RGB")
                  buffer = io.BytesIO()
                  image.save(buffer, format="JPEG", quality=94, optimize=True, progressive=False, subsampling=0)
              else:
                  if image.mode not in ("RGB", "RGBA", "L", "LA", "P"):
                      image = image.convert("RGBA")
                  buffer = io.BytesIO()
                  image.save(buffer, format="PNG", optimize=True, compress_level=9)
              data = buffer.getvalue()
              encoded = base64.b64encode(data).decode("ascii")
              print(f"ASSET_INFO:{output_name}:source={source_name}:original={original_size[0]}x{original_size[1]}:output={image.size[0]}x{image.size[1]}:bytes={len(data)}:b64={len(encoded)}")
              print(f"ASSET_BEGIN:{output_name}")
              for i in range(0, len(encoded), 12000):
                  print(f"ASSET_CHUNK:{output_name}:{i // 12000:05d}:{encoded[i:i+12000]}")
              print(f"ASSET_END:{output_name}")
          PY
