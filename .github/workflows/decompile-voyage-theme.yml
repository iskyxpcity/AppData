name: Decompile complete Voyage Compose UI source (temporary analysis branch)

on:
  push:
    branches:
      - "tools/voyage-theme-decompile-20261028"
    paths:
      - ".github/workflows/decompile-voyage-theme.yml"

permissions:
  contents: write

concurrency:
  group: voyage-full-ui-decompile
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout all Voyage DEX inputs
        uses: actions/checkout@v4
        with:
          ref: tools/voyage-theme-decompile-20261028
          sparse-checkout: |
            voyage/classes.dex
            voyage/classes2.dex
            voyage/classes3.dex
            voyage/classes4.dex
            voyage/classes5.dex
            voyage/classes6.dex
            voyage/classes7.dex
            voyage/classes8.dex
            voyage/classes9.dex
            voyage/classes10.dex
            voyage/classes11.dex
            voyage/classes12.dex
            voyage/classes13.dex
            voyage/classes14.dex
          sparse-checkout-cone-mode: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download official JADX CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip --output "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          test -x "$RUNNER_TEMP/jadx/bin/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --version

      - name: Decompile all application and library classes
        shell: bash
        run: |
          set -euo pipefail
          JADx="$RUNNER_TEMP/jadx/bin/jadx"
          mkdir -p decompiled
          inputs=()
          for dex in voyage/classes*.dex; do
            [ -s "$dex" ] || continue
            inputs+=("$dex")
            echo "Input: $dex ($(stat -c%s "$dex") bytes)"
          done
          test "${#inputs[@]}" -eq 14
          "$JADx" -j 2 --no-res --show-bad-code -d decompiled "${inputs[@]}" 2>&1 | tee decompiled/jadx.log
          printf '# Voyage full DEX decompilation\n\n' > decompiled/ANALYSIS_INDEX.md
          printf 'Tool: JADX CLI 1.5.6; Java 17.\n\n' >> decompiled/ANALYSIS_INDEX.md
          printf 'Inputs: %s DEX files.\n\n' "${#inputs[@]}" >> decompiled/ANALYSIS_INDEX.md
          printf 'Java source files: %s\n' "$(find decompiled -type f -name '*.java' | wc -l)" >> decompiled/ANALYSIS_INDEX.md
          printf 'Kotlin metadata files: %s\n' "$(find decompiled -type f -name '*.kotlin_metadata' | wc -l)" >> decompiled/ANALYSIS_INDEX.md
          printf '\n## Compose interaction API references\n' >> decompiled/ANALYSIS_INDEX.md
          grep -RIlE 'PressInteraction|collectIsPressedAsState|MutableInteractionSource|animateFloatAsState|graphicsLayer|combinedClickable|clickable' decompiled --include='*.java' | sed 's#^#- #' >> decompiled/ANALYSIS_INDEX.md || true
          printf '\n## Scale / transform references\n' >> decompiled/ANALYSIS_INDEX.md
          grep -RIlE 'scaleX|scaleY|scale\(' decompiled --include='*.java' | sed 's#^#- #' >> decompiled/ANALYSIS_INDEX.md || true

      - name: Upload full decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: voyage-full-compose-ui-decompiled-source
          path: decompiled/
          if-no-files-found: error
          retention-days: 14


      - name: Publish Compose interaction candidates to a read-only analysis branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p decompiled/interaction-candidates
          grep -RIlE 'PressInteraction|collectIsPressedAsState|MutableInteractionSource|animateFloatAsState|graphicsLayer|combinedClickable|scaleX|scaleY' decompiled --include='*.java' > decompiled/interaction-candidates/FILES.txt || true
          while IFS= read -r src; do
            [ -s "$src" ] || continue
            mkdir -p "decompiled/interaction-candidates/$(dirname "$src")"
            cp "$src" "decompiled/interaction-candidates/$src"
          done < decompiled/interaction-candidates/FILES.txt
          {
            echo '# Compose interaction candidate source'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Candidate files: $(wc -l < decompiled/interaction-candidates/FILES.txt)"
            echo
            echo 'The source files below are copied verbatim from the successful full JADX output.'
          } > decompiled/interaction-candidates/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add --detach "$RUNNER_TEMP/interaction-publish" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/interaction-publish" switch --orphan analysis/voyage-compose-interactions-20261030
          git -C "$RUNNER_TEMP/interaction-publish" rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/interaction-publish"
          cp -R decompiled/interaction-candidates "$RUNNER_TEMP/interaction-publish/"
          cp decompiled/ANALYSIS_INDEX.md "$RUNNER_TEMP/interaction-publish/" 2>/dev/null || true
          git -C "$RUNNER_TEMP/interaction-publish" add interaction-candidates ANALYSIS_INDEX.md
          git -C "$RUNNER_TEMP/interaction-publish" commit -m 'Publish Voyage Compose interaction source candidates'
          git -C "$RUNNER_TEMP/interaction-publish" push origin HEAD:refs/heads/analysis/voyage-compose-interactions-20261030
