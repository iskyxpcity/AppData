name: Voyage full DEX forensic decompile

on:
  push:
    branches:
      - analysis/voyage-full-dex-forensics-20261121
    paths:
      - ".github/workflows/voyage-full-dex-forensics.yml"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout forensic branch with original APK contents
        uses: actions/checkout@v4
        with:
          ref: analysis/voyage-full-dex-forensics-20261121
          sparse-checkout: |
            voyage/classes.dex
            voyage/classes2.dex
            voyage/classes3.dex
            voyage/classes4.dex
            voyage/classes5.dex
            voyage/classes6.dex
            voyage/classes7.dex
            voyage/classes8.dex
            voyage/classes9.dex
            voyage/classes10.dex
            voyage/classes11.dex
            voyage/classes12.dex
            voyage/classes13.dex
            voyage/classes14.dex
            .github/workflows/voyage-full-dex-forensics.yml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download JADX 1.5.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/jadx.zip" \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx/bin/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --version

      - name: Decompile all 14 original DEX files
        shell: bash
        env:
          JAVA_OPTS: "-Xmx6g"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voyage-full-source"
          "$RUNNER_TEMP/jadx/bin/jadx" \
            --threads-count 4 \
            --no-res \
            --show-bad-code \
            -d "$RUNNER_TEMP/voyage-full-source" \
            voyage/classes.dex voyage/classes2.dex voyage/classes3.dex voyage/classes4.dex \
            voyage/classes5.dex voyage/classes6.dex voyage/classes7.dex voyage/classes8.dex \
            voyage/classes9.dex voyage/classes10.dex voyage/classes11.dex voyage/classes12.dex \
            voyage/classes13.dex voyage/classes14.dex

      - name: Extract source evidence for wave and shadow call chains
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/voyage-full-source/sources"
          OUT="$RUNNER_TEMP/voyage-forensic-evidence"
          mkdir -p "$OUT/targeted"
          python3 - "$SRC" "$OUT" <<'PY'
          import hashlib, os, re, shutil, sys
          from pathlib import Path
          src, out = Path(sys.argv[1]), Path(sys.argv[2])
          patterns = re.compile(
              r"wgo0|vne|xgo0|setShadowLayer|setAmbientShadowColor|"
              r"setSpotShadowColor|setElevation|setOutline|shadowElevation|"
              r"RenderNode|graphicsLayer|drawIntoCanvas|drawPath|Outline\\.Generic"
          )
          hits = []
          for p in src.rglob("*.java"):
              try:
                  data = p.read_text(errors="replace")
              except Exception:
                  continue
              if patterns.search(data):
                  hits.append(p)
                  dst = out / "targeted" / p.relative_to(src)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, dst)
          report = [
              "Voyage APK full DEX decompilation evidence",
              f"Source classes decompiled: {sum(1 for _ in src.rglob('*.java'))}",
              f"Targeted source files: {len(hits)}",
              "",
              "Targeted files:"
          ] + [str(p.relative_to(src)) for p in sorted(hits)]
          (out / "FORENSIC_INDEX.txt").write_text("\\n".join(report) + "\\n")
          print("\\n".join(report[:4]))
          PY
          sha256sum voyage/classes*.dex > "$OUT/DEX_SHA256SUMS.txt"
          cd "$RUNNER_TEMP"
          zip -qr voyage-forensic-evidence.zip voyage-forensic-evidence

      - name: Upload focused source evidence
        uses: actions/upload-artifact@v4
        with:
          name: voyage-full-dex-forensic-evidence
          path: ${{ runner.temp }}/voyage-forensic-evidence.zip
          if-no-files-found: error
          retention-days: 14
